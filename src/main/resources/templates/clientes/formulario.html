<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.DPICliente} != null ? 'Editar Cliente' : 'Nuevo Cliente'">Formulario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2>
                <i class="fas fa-user"></i>
                <span th:text="${cliente.DPICliente} != null ? 'Editar Cliente' : 'Nuevo Cliente'"></span>
            </h2>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <form th:action="${cliente.DPICliente} != null ?
                          @{/clientes/actualizar/{dpi}(dpi=${cliente.DPICliente})} :
                          @{/clientes/guardar}"
                  th:object="${cliente}" method="post">

                <div class="mb-3">
                    <label for="dpi" class="form-label">DPI *</label>
                    <input type="text" class="form-control" id="dpi" th:field="*{DPICliente}"
                           th:readonly="${cliente.DPICliente} != null" required>
                    <div class="form-text" th:if="${cliente.DPICliente} != null">El DPI no se puede modificar</div>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre *</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombreCliente}" required>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label">Apellido *</label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellidoCliente}" required>
                </div>

                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <textarea class="form-control" id="direccion" th:field="*{direccionCliente}" rows="2"></textarea>
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-control" id="estado" th:field="*{estado}">
                        <option th:value="1">Activo</option>
                        <option th:value="0">Inactivo</option>
                    </select>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/clientes/lista}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
