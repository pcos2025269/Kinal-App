<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${venta != null and venta.codigoVenta != null} ? 'Editar Venta' : 'Nueva Venta'">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="fas fa-shopping-cart"></i> <span th:text="${venta != null and venta.codigoVenta != null} ? 'Editar Venta' : 'Nueva Venta'"></span></h3>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="${venta != null and venta.codigoVenta != null} ? @{/venta/actualizar/{id}(id=${venta.codigoVenta})} : @{/venta/guardar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Cliente</label>
                    <select name="dpiCliente" class="form-select" required>
                        <option value="">Seleccione un cliente</option>
                        <option th:each="c : ${clientes}"
                                th:value="${c.DPICliente}"
                                th:selected="${venta != null and venta.clienteVenta != null and venta.clienteVenta.DPICliente == c.DPICliente}"
                                th:text="${c.nombreCliente} + ' ' + ${c.apellidoCliente}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <select name="idUsuario" class="form-select" required>
                        <option value="">Seleccione un usuario</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:selected="${venta != null and venta.usuarioVenta != null and venta.usuarioVenta.id == u.id}"
                                th:text="${u.nameUser}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Total</label>
                    <input type="number" step="0.01" name="total" class="form-control" th:value="${venta != null ? venta.total : ''}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de Venta</label>
                    <input type="date" name="fechaVenta" class="form-control"
                           th:value="${venta != null ? venta.fechaVenta : ''}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                        <option value="1" th:selected="${venta != null and venta.estado == 1}">Activo</option>
                        <option value="0" th:selected="${venta != null and venta.estado == 0}">Inactivo</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/venta/lista}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
