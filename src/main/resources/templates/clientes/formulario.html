<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./static/img/kinal.png" th:href="@{/img/kinal.png}">
    <title th:text="${cliente != null and cliente.DPICliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>
                <i class="fas fa-user"></i>
                <span th:text="${cliente != null and cliente.DPICliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'"></span>
            </h3>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${cliente != null and cliente.DPICliente != null}
                        ? @{/clientes/actualizar/{dpi}(dpi=${cliente.DPICliente})}
                        : @{/clientes/guardar}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">DPI</label>
                    <input type="text"
                           name="DPICliente"
                           class="form-control"
                           th:value="${cliente != null ? cliente.DPICliente : ''}"
                           th:readonly="${cliente != null and cliente.DPICliente != null}"
                           placeholder="Ej: 1234567890101"
                           required>
                    <small class="text-muted" th:if="${cliente != null and cliente.DPICliente != null}">
                        El DPI no puede modificarse.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           name="nombreCliente"
                           class="form-control"
                           th:value="${cliente != null ? cliente.nombreCliente : ''}"
                           placeholder="Nombre del cliente"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text"
                           name="apellidoCliente"
                           class="form-control"
                           th:value="${cliente != null ? cliente.apellidoCliente : ''}"
                           placeholder="Apellido del cliente"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text"
                           name="direccionCliente"
                           class="form-control"
                           th:value="${cliente != null ? cliente.direccionCliente : ''}"
                           placeholder="Dirección del cliente"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                        <option value="1" th:selected="${cliente != null and cliente.estado == 1}">Activo</option>
                        <option value="0" th:selected="${cliente != null and cliente.estado == 0}">Inactivo</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a th:href="@{/clientes/lista}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
