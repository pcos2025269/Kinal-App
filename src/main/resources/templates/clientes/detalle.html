<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h3>
        <i class="fas fa-id-card"></i> Detalle del Cliente
      </h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div th:if="${cliente}" class="row">
        <div class="col-md-6">
          <table class="table table-bordered">
            <tr>
              <th class="bg-light">DPI:</th>
              <td th:text="${cliente.dpi}"></td>
            </tr>
            <tr>
              <th class="bg-light">Nombre:</th>
              <td th:text="${cliente.nombre}"></td>
            </tr>
            <tr>
              <th class="bg-light">Apellido:</th>
              <td th:text="${cliente.apellido}"></td>
            </tr>
            <tr>
              <th class="bg-light">Dirección:</th>
              <td th:text="${cliente.direccion}"></td>
            </tr>
            <tr>
              <th class="bg-light">Estado:</th>
              <td>
                <span th:if="${cliente.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${cliente.estado == 0}" class="badge bg-danger">Inactivo</span>
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <a th:href="@{/clientes/lista}" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Volver
        </a>
        <a th:if="${cliente}" th:href="@{/clientes/editar/{dpi}(dpi=${cliente.dpi})}"
           class="btn btn-warning">
          <i class="fas fa-edit"></i> Editar
        </a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
