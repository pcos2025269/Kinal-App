<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3><i class="fas fa-user"></i> <span th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></span></h3>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="${usuario.id != null} ? @{/users/actualizar/{id}(id=${usuario.id})} : @{/users/guardar}" method="post">
                <div th:if="${usuario.id != null}" class="mb-3">
                    <label class="form-label">ID</label>
                    <input type="text" class="form-control" th:value="${usuario.id}" readonly disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" name="nameUser" class="form-control" th:value="${usuario.nameUser}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="passwordUser" class="form-control" th:value="${usuario.passwordUser}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" th:value="${usuario.email}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" required>
                        <option value="">Seleccione</option>
                        <option value="ADMIN" th:selected="${usuario.rol == 'ADMIN'}">ADMIN</option>
                        <option value="VENDEDOR" th:selected="${usuario.rol == 'VENDEDOR'}">VENDEDOR</option>
                        <option value="CLIENTE" th:selected="${usuario.rol == 'CLIENTE'}">CLIENTE</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select" required>
                        <option value="1" th:selected="${usuario.estado == 1}">Activo</option>
                        <option value="0" th:selected="${usuario.estado == 0}">Inactivo</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/users/lista}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
