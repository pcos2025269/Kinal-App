<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Usuarios</title>
  <link rel="icon" href="./static/img/kinal.png" th:href="@{/img/kinal.png}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2 class="mb-0"><i class="fas fa-users"></i> Usuarios</h2>
      <a th:href="@{/users/nuevo}" class="btn btn-light"><i class="fas fa-plus"></i> Nuevo Usuario</a>
        <a th:href="@{/Inicio}" class="btn btn-secondary">Volver al menú</a>
    </div>
    <div class="card-body">
      <div class="row mb-3">

        <div class="col-md-6">
          <form th:action="@{/users/lista}" method="get" class="d-flex">
            <input type="text"
                   name="buscar"
                   class="form-control me-2"
                   placeholder="Buscar por usuario o correo"
                   th:value="${buscar}">

            <button type="submit" class="btn btn-primary">
              <i class="fas fa-search"></i>
            </button>
          </form>
        </div>

        <div class="col-md-6">
          <form th:action="@{/users/buscarEstado}" method="get" class="d-flex">

            <select name="estado" class="form-select me-2">
              <option value="">Filtrar por estado</option>
              <option value="1">Activo</option>
              <option value="0">Inactivo</option>
            </select>

            <button type="submit" class="btn btn-success">
              <i class="fas fa-filter"></i>
            </button>
          </form>
        </div>

      </div>
      <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre de Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nameUser}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol}"></td>
            <td>
              <span th:if="${u.estado == 1}" class="badge bg-success">Activo</span>
              <span th:if="${u.estado == 0}" class="badge bg-danger">Inactivo</span>
            </td>
            <td>
              <a th:href="@{/users/ver/{id}(id=${u.id})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
              <a th:href="@{/users/editar/{id}(id=${u.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
              <a th:href="@{/users/eliminar/{id}(id=${u.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este usuario?')"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
          <tr th:if="${usuarios.empty}">
            <td colspan="6" class="text-center">No hay usuarios registrados</td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
</body>
</html>
