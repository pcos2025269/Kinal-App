<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h3><i class="fas fa-id-card"></i> Detalle de Usuario</h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${usuario != null}">
        <p><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
        <p><strong>Nombre de Usuario:</strong> <span th:text="${usuario.nameUser}"></span></p>
        <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
        <p><strong>Rol:</strong> <span th:text="${usuario.rol}"></span></p>
        <p><strong>Estado:</strong>
          <span th:if="${usuario.estado == 1}" class="badge bg-success">Activo</span>
          <span th:if="${usuario.estado == 0}" class="badge bg-danger">Inactivo</span>
        </p>
      </div>
      <a th:href="@{/users/lista}" class="btn btn-secondary">Volver</a>
      <a th:if="${usuario != null}" th:href="@{/users/editar/{id}(id=${usuario.id})}" class="btn btn-warning">Editar</a>
    </div>
  </div>
</div>
</body>
</html>
