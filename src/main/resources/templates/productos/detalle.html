<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h3>
        <i class="fas fa-box"></i> Detalle del Producto
      </h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div th:if="${producto}" class="row">
        <div class="col-md-6">
          <table class="table table-bordered">
            <tr>
              <th class="bg-light">Código:</th>
              <td th:text="${producto.codigoProducto}"></td>
            </tr>
            <tr>
              <th class="bg-light">Nombre:</th>
              <td th:text="${producto.nombreProducto}"></td>
            </tr>
            <tr>
              <th class="bg-light">Precio:</th>
              <td>Q <span th:text="${producto.precio}"></span></td>
            </tr>
            <tr>
              <th class="bg-light">Stock:</th>
              <td th:text="${producto.stock}"></td>
            </tr>
            <tr>
              <th class="bg-light">Estado:</th>
              <td>
                <span th:if="${producto.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${producto.estado == 0}" class="badge bg-danger">Inactivo</span>
              </td>
            </tr>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <a th:href="@{/productos/lista}" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Volver
        </a>
        <a th:if="${producto}" th:href="@{/productos/editar/{id}(id=${producto.codigoProducto})}"
           class="btn btn-warning" sec:authorize="hasRole('ADMIN')">
          <i class="fas fa-edit"></i> Editar
        </a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
