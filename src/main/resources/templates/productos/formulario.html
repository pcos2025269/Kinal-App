<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./static/img/kinal.png" th:href="@{/img/kinal.png}">
    <title th:text="${producto.codigoProducto} != null ? 'Editar Producto' : 'Nuevo Producto'">Formulario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2>
                <i class="fas fa-box"></i>
                <span th:text="${producto.codigoProducto} != null ? 'Editar Producto' : 'Nuevo Producto'"></span>
            </h2>
        </div>
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <form th:action="${producto.codigoProducto} != null ?
                          @{/productos/actualizar/{id}(id=${producto.codigoProducto})} :
                          @{/productos/guardar}"
                  th:object="${producto}" method="post">

                <!-- Solo mostrar el campo código si es edición -->
                <div th:if="${producto.codigoProducto} != null" class="mb-3">
                    <label for="codigo" class="form-label">Código</label>
                    <input type="text" class="form-control" id="codigo" th:value="${producto.codigoProducto}" readonly disabled>
                    <div class="form-text">El código es auto-generado y no se puede modificar</div>
                </div>

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Producto *</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombreProducto}" required>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio *</label>
                    <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required>
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label">Stock *</label>
                    <input type="number" class="form-control" id="stock" th:field="*{stock}" required>
                </div>

                <div class="mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-control" id="estado" th:field="*{estado}">
                        <option th:value="1">Activo</option>
                        <option th:value="0">Inactivo</option>
                    </select>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <a th:href="@{/productos/lista}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
