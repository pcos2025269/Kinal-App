<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0">
                <i class="fas fa-box"></i> Productos
            </h2>
            <a th:href="@{/productos/nuevo}" class="btn btn-light">
                <i class="fas fa-plus"></i> Nuevo Producto
            </a>
            <a th:href="@{/Inicio}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver al menú
            </a>
        </div>
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-8 mx-auto">
                    <form th:action="@{/productos/lista}" method="get" class="d-flex">
                        <input type="text"
                               name="buscar"
                               class="form-control me-2"
                               placeholder="Buscar por Código o Nombre..."
                               th:value="${buscar}">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i> Buscar
                        </button>
                        <a th:href="@{/productos/lista}" class="btn btn-secondary ms-2">
                            <i class="fas fa-sync-alt"></i> Limpiar
                        </a>
                    </form>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-warning alert-dismissible fade show">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.codigoProducto}"></td>
                        <td th:text="${producto.nombreProducto}"></td>
                        <td>Q <span th:text="${producto.precio}"></span></td>
                        <td th:text="${producto.stock}"></td>
                        <td>
                            <span th:if="${producto.estado == 1}" class="badge bg-success">Activo</span>
                            <span th:if="${producto.estado == 0}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/productos/ver/{id}(id=${producto.codigoProducto})}"
                               class="btn btn-sm btn-info me-1" title="Ver">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/productos/editar/{id}(id=${producto.codigoProducto})}"
                               class="btn btn-sm btn-warning me-1" title="Editar" sec:authorize="hasRole('ADMIN')">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/productos/eliminar/{id}(id=${producto.codigoProducto})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Estás seguro de eliminar este producto?')"
                               title="Eliminar" sec:authorize="hasRole('ADMIN')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${productos.empty}">
                        <td colspan="6" class="text-center py-4">
                            <i class="fas fa-info-circle"></i> No hay productos registrados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${not productos.empty}" class="mt-2 text-muted">
                <small>Total: <strong th:text="${productos.size()}"></strong> producto(s)</small>
            </div>

            <div class="mt-3">

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
