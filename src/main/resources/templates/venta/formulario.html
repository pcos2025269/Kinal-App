<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3>Nueva Venta</h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form action="/venta/guardar" method="post">
        <div class="mb-3">
          <label>Cliente</label>
          <select name="dpiCliente" class="form-control" required>
            <option value="">Seleccione</option>
            <option th:each="c : ${clientes}" th:value="${c.DPICliente}" th:text="${c.nombreCliente} + ' ' + ${c.apellidoCliente}"></option>
          </select>
        </div>

        <div class="mb-3">
          <label>Usuario</label>
          <select name="id" class="form-control" required>
            <option value="">Seleccione</option>
            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nameUser}"></option>
          </select>
        </div>

        <div class="mb-3">
          <label>Total</label>
          <input type="number" step="0.01" name="total" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/venta/lista" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
