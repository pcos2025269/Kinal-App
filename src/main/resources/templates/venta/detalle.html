<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-info text-white">
      <h3>Detalle Venta</h3>
    </div>
    <div class="card-body">
      <p><strong>Codigo:</strong> <span th:text="${venta.codigoVenta}"></span></p>
      <p><strong>Fecha:</strong> <span th:text="${venta.fechaVenta}"></span></p>
      <p><strong>Cliente:</strong> <span th:text="${venta.clienteVenta.nombreCliente}"></span></p>
      <p><strong>Usuario:</strong> <span th:text="${venta.usuarioVenta.nameUser}"></span></p>
      <p><strong>Total:</strong> Q <span th:text="${venta.total}"></span></p>
      <p><strong>Estado:</strong>
        <span th:if="${venta.estado == 1}">Activo</span>
        <span th:if="${venta.estado == 0}">Inactivo</span>
      </p>
      <a href="/venta/lista" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>
</body>
</html>
