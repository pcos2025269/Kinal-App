<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h3><i class="fas fa-receipt"></i> Detalle de Venta</h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${venta != null}">
        <p><strong>Código:</strong> <span th:text="${venta.codigoVenta}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${venta.fechaVenta}"></span></p>
        <p><strong>Cliente:</strong> <span th:text="${venta.clienteVenta.nombreCliente} + ' ' + ${venta.clienteVenta.apellidoCliente}"></span></p>
        <p><strong>Usuario:</strong> <span th:text="${venta.usuarioVenta.nameUser}"></span></p>
        <p><strong>Total:</strong> Q <span th:text="${venta.total}"></span></p>
        <p><strong>Estado:</strong>
          <span th:if="${venta.estado == 1}" class="badge bg-success">Activo</span>
          <span th:if="${venta.estado == 0}" class="badge bg-danger">Inactivo</span>
        </p>
      </div>
      <a th:href="@{/venta/lista}" class="btn btn-secondary">Volver</a>
      <a th:if="${venta != null}" th:href="@{/venta/editar/{id}(id=${venta.codigoVenta})}" class="btn btn-warning">Editar</a>
    </div>
  </div>
</div>
</body>
</html>
