<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3>Ventas</h3>
      <a href="/venta/nuevo" class="btn btn-light">Nueva Venta</a>
    </div>
    <div class="card-body">
      <table class="table">
        <thead>
        <tr>
          <th>Codigo</th>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Usuario</th>
          <th>Total</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
          <td th:text="${v.codigoVenta}"></td>
          <td th:text="${v.fechaVenta}"></td>
          <td th:text="${v.clienteVenta.nombreCliente}"></td>
          <td th:text="${v.usuarioVenta.nameUser}"></td>
          <td th:text="${v.total}"></td>
          <td>
            <span th:if="${v.estado == 1}" class="badge bg-success">Activo</span>
            <span th:if="${v.estado == 0}" class="badge bg-danger">Inactivo</span>
          </td>
          <td>
            <a th:href="@{/venta/ver/{id}(id=${v.codigoVenta})}" class="btn btn-info">Ver</a>
            <a th:href="@{/venta/editar/{id}(id=${v.codigoVenta})}" class="btn btn-warning">Editar</a>
            <a th:href="@{/venta/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-danger" onclick="return confirm('Eliminar?')">Eliminar</a>
          </td>
        </tr>
        </tbody>
      </table>
      <a href="/" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>
</body>
</html>
