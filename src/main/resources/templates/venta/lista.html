<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Lista de Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/global.css}">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2><i class="fas fa-shopping-cart"></i> Ventas</h2>
      <a th:href="@{/venta/nuevo}" class="btn btn-light"><i class="fas fa-plus"></i> Nueva Venta</a>
        <a th:href="@{/Inicio}" class="btn btn-secondary">Volver al menú</a>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
          <tr>
            <th>Código</th><th>Fecha</th><th>Cliente</th><th>Usuario</th><th>Total</th><th>Estado</th><th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="v : ${ventas}">
            <td th:text="${v.codigoVenta}"></td>
            <td th:text="${v.fechaVenta}"></td>
            <td th:text="${v.clienteVenta.nombreCliente} + ' ' + ${v.clienteVenta.apellidoCliente}"></td>
            <td th:text="${v.usuarioVenta.nameUser}"></td>
            <td>Q <span th:text="${v.total}"></span></td>
            <td>
              <span th:if="${v.estado == 1}" class="badge bg-success">Activo</span>
              <span th:if="${v.estado == 0}" class="badge bg-danger">Inactivo</span>
            </td>
            <td>
              <a th:href="@{/venta/ver/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
              <a th:href="@{/venta/editar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-warning" sec:authorize="hasRole('ADMIN')"><i class="fas fa-edit"></i></a>
              <a th:href="@{/venta/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')" sec:authorize="hasRole('ADMIN')"><i class="fas fa-trash"></i></a>
            </td>
          </tr>
          <tr th:if="${ventas.empty}"><td colspan="7">No hay ventas registradas</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>
</body>
</html>
