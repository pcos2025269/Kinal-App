<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Venta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-info text-white">
      <h3>
        <i class="fas fa-list"></i> Detalle de Venta
      </h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div th:if="${detalle}" class="row">
        <div class="col-md-6">
          <table class="table table-bordered">
            <tr>
              <th class="bg-light">Código Detalle:</th>
              <td th:text="${detalle.codigoDetalleVenta}"></td>
            </tr>
            <tr>
              <th class="bg-light">Producto:</th>
              <td th:text="${detalle.detalleproducto.nombreProducto}"></td>
            </tr>
            <tr>
              <th class="bg-light">Cantidad:</th>
              <td th:text="${detalle.cantidad}"></td>
            </tr>
            <tr>
              <th class="bg-light">Precio Unitario:</th>
              <td>Q <span th:text="${detalle.precioUnitario}"></span></td>
            </tr>
            <tr>
              <th class="bg-light">SubTotal:</th>
              <td>Q <span th:text="${detalle.subTotal}"></span></td>
            </tr>
            <tr>
              <th class="bg-light">Venta Código:</th>
              <td th:text="${detalle.detalleVenta.codigoVenta}"></td>
            </tr>
            <tr>
              <th class="bg-light">Cliente:</th>
              <td th:text="${detalle.detalleVenta.clienteVenta.nombreCliente} + ' ' + ${detalle.detalleVenta.clienteVenta.apellidoCliente}"></td>
            </tr>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <a th:href="@{/detalleVenta/lista}" class="btn btn-secondary">
          <i class="fas fa-arrow-left"></i> Volver
        </a>
        <a th:if="${detalle}" th:href="@{/detalleVenta/editar/{id}(id=${detalle.codigoDetalleVenta})}"
           class="btn btn-warning">
          <i class="fas fa-edit"></i> Editar
        </a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
