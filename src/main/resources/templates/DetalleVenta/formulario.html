<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Detalle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3><i class="fas fa-list"></i> Nuevo Detalle de Venta</h3>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <form action="/detalleVenta/guardar" method="post">
        <div class="mb-3">
          <label>Producto</label>
          <select name="codigoProducto" class="form-select" required>
            <option value="">Seleccione un producto</option>
            <option th:each="p : ${productos}" th:value="${p.codigoProducto}" th:text="${p.nombreProducto} + ' - Q' + ${p.precio}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label>Venta</label>
          <select name="codigoVenta" class="form-select" required>
            <option value="">Seleccione una venta</option>
            <option th:each="v : ${ventas}" th:value="${v.codigoVenta}" th:text="'Venta #' + ${v.codigoVenta} + ' - ' + ${v.clienteVenta.nombreCliente}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label>Cantidad</label>
          <input type="number" name="cantidad" class="form-control" required min="1">
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/detalleVenta/lista}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
