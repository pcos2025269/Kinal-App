<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${detalleVenta.codigoDetalleVenta} != null ? 'Editar Detalle' : 'Nuevo Detalle'">Formulario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2>
        <i class="fas fa-list"></i>
        <span th:text="${detalleVenta.codigoDetalleVenta} != null ? 'Editar Detalle' : 'Nuevo Detalle'"></span>
      </h2>
    </div>
    <div class="card-body">
      <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
      </div>

      <form th:action="${detalleVenta.codigoDetalleVenta} != null ?
                          @{/detalleVenta/actualizar/{id}(id=${detalleVenta.codigoDetalleVenta})} :
                          @{/detalleVenta/guardar}"
            method="post">

        <div th:if="${detalleVenta.codigoDetalleVenta} != null" class="mb-3">
          <label class="form-label">Código Detalle</label>
          <input type="text" class="form-control" th:value="${detalleVenta.codigoDetalleVenta}" readonly disabled>
        </div>

        <div class="mb-3">
          <label class="form-label">Producto *</label>
          <select name="codigoProducto" class="form-select" required>
            <option value="">Seleccione un producto</option>
            <option th:each="producto : ${productos}"
                    th:value="${producto.codigoProducto}"
                    th:selected="${detalleVenta.detalleproducto != null and detalleVenta.detalleproducto.codigoProducto == producto.codigoProducto}"
                    th:text="${producto.nombreProducto} + ' - Q' + ${producto.precio}">
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Venta *</label>
          <select name="codigoVenta" class="form-select" required>
            <option value="">Seleccione una venta</option>
            <option th:each="venta : ${ventas}"
                    th:value="${venta.codigoVenta}"
                    th:selected="${detalleVenta.detalleVenta != null and detalleVenta.detalleVenta.codigoVenta == venta.codigoVenta}"
                    th:text="'Venta #' + ${venta.codigoVenta} + ' - ' + ${venta.clienteVenta.nombreCliente}">
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad *</label>
          <input type="number" class="form-control" name="cantidad" th:value="${detalleVenta.cantidad}" required min="1">
        </div>

        <div class="mt-3">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Guardar
          </button>
          <a th:href="@{/detalleVenta/lista}" class="btn btn-secondary">
            <i class="fas fa-times"></i> Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
