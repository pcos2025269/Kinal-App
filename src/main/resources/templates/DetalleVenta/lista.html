<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Detalles de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h2><i class="fas fa-list"></i> Detalle de Ventas</h2>
      <a th:href="@{/DetalleVenta/nuevo}" class="btn btn-light"><i class="fas fa-plus"></i> Nuevo Detalle</a>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
          <tr>
            <th>Código</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>SubTotal</th>
            <th>Venta</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="d : ${detalles}">
            <td th:text="${d.codigoDetalleVenta}"></td>
            <td th:text="${d.detalleproducto.nombreProducto}"></td>
            <td th:text="${d.cantidad}"></td>
            <td>Q <span th:text="${d.precioUnitario}"></span></td>
            <td>Q <span th:text="${d.subTotal}"></span></td>
            <td th:text="${d.detalleVenta.codigoVenta}"></td>
            <td>
              <a th:href="@{/DetalleVenta/ver/{id}(id=${d.codigoDetalleVenta})}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
            </td>
          </tr>
          <tr th:if="${detalles.empty}"><td colspan="7">No hay detalles registrados</td></tr>
          </tbody>
        </table>
      </div>
      <a th:href="@{/Inicio}" class="btn btn-secondary">Volver al menú</a>
    </div>
  </div>
</div>
</body>
</html>
