<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="icon" href="./static/img/kinal.png" th:href="@{/img/kinal.png}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-container">
        <img th:src="@{/img/kinal.png}" alt="Logo Kinal">
        <h2>Crear Cuenta</h2>

        <div th:if="${param.error != null}" class="alert alert-error">
            <span th:if="${param.error[0] == 'existe'}">El nombre de usuario ya está en uso.</span>
        </div>

        <form th:action="@{/registro}" method="post">
            <div class="input-group">
                <span class="input-icon"><i class="fa fa-user"></i></span>
                <input type="text" name="nameUser" placeholder="Nombre de usuario" required autofocus>
            </div>
            <div class="input-group">
                <span class="input-icon"><i class="fa fa-lock"></i></span>
                <input type="password" name="passwordUser" placeholder="Contraseña" required>
            </div>
            <div class="input-group">
                <span class="input-icon"><i class="fa fa-envelope"></i></span>
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="action-group">
                <button type="submit" class="btn-primary">Registrarse</button>
            </div>
            <div class="footer-links">
                <a th:href="@{/login}" class="link-secondary">¿Ya tienes cuenta? Inicia Sesión</a>
            </div>
        </form>

    </div>
</body>
</html>
